table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100; policy accept;

        tcp dport 8080 dnat to 10.248.0.101:80
        tcp dport 5554 dnat to 10.248.0.101:554
        tcp dport 7681 dnat to 10.248.0.101:7681
        tcp dport 8081 dnat to 10.248.0.102:80
        tcp dport 5555 dnat to 10.248.0.102:554
    }

    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        # ip saddr 192.168.1.0/24 snat to 
    }
}
